[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "four04ish"
version = "0.1.0"
description = "404-ish: small, cautious HTTP observations without existential conclusions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []
keywords = ["http", "url", "link-checker", "robots-txt", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[project.urls]
Repository = "https://github.com/rihito-dev/404-ish"

[project.scripts]
404-ish = "four04ish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
